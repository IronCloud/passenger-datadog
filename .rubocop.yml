AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable

Metrics/AbcSize:
  Max: 19

Metrics/BlockLength:
  Exclude:
    - 'passenger_datadog.gemspec'
    - 'spec/**/*'

Layout/LineLength:
  Max: 120

# Keyword arguments are self-documenting at the call site, so a long keyword
# list does not carry the readability cost this cop guards against.
Metrics/ParameterLists:
  CountKeywordArgs: false

Naming/FileName:
  Exclude:
    - 'bin/passenger-datadog'

Style/Documentation:
  Enabled: false
